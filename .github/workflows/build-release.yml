# .github/workflows/build-release.yml
name: Build and Release Tauri App

on:
  push:
    tags:
      - 'v*' # Запуск при создании тега v1.0.0, v2.1.0 и т.д.
    branches:
      - main
      - develop
  workflow_dispatch: # Ручной запуск

env:
  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }} # Для подписи обновлений
  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APP_VERSION: ${GITHUB_REF_NAME#v}

jobs:
  # Сборка под Linux
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        format: [deb, appimage, rpm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
          override: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install ARM64 dependencies
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config-aarch64-linux-gnu

          # Настройка linker для ARM64
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
            cargo build --release --target aarch64-unknown-linux-gnu
            npm run tauri build -- --target aarch64-unknown-linux-gnu --bundles ${{ matrix.format }}
          else
            npm run tauri build -- --bundles ${{ matrix.format }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.format }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.rpm
          if-no-files-found: ignore

  # Сборка под Windows
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, i686]
        format: [nsis, msi, wix]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
          override: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Install WiX Toolset
        if: matrix.format == 'wix' || matrix.format == 'msi'
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.UI.wixext WixToolset.Util.wixext

      - name: Build Tauri app
        run: |
          npm run tauri build -- --bundles ${{ matrix.format }} --target ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
        env:
          TAURI_SIGNING_COMMAND: ${{ secrets.WINDOWS_SIGNING_COMMAND }} # Для подписи .exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.format }}
          path: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi

  # Сборка под macOS (опционально)
  build-macos:
    runs-on: macos-latest
    if: false # Отключено, включите если нужно
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        format: [app, dmg]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
          override: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: |
          npm run tauri build -- --bundles ${{ matrix.format }} --target ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-${{ matrix.format }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/release/bundle/**/*.app

  # Создание релиза
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.app
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
