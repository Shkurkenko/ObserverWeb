name: Build and Release Tauri App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Сборка под Linux
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
        format: [deb, appimage, rpm]
        include:
          - arch: arm64
            format: deb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
          override: true

      - name: Install Linux dependencies (amd64)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install ARM64 dependencies
        if: matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update

          # Устанавливаем кросс-компиляторы
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config-aarch64-linux-gnu \
            libc6-dev:arm64 \
            libssl-dev:arm64 \
            libgtk-3-dev:arm64 \
            libsoup2.4-dev:arm64 \
            libjavascriptcoregtk-4.0-dev:arm64 \
            libwebkit2gtk-4.0-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (amd64)
        if: matrix.arch == 'amd64'
        run: npm run tauri build -- --bundles ${{ matrix.format }}

      - name: Build Tauri app (arm64)
        if: matrix.arch == 'arm64'
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++

          npm run tauri build -- --target aarch64-unknown-linux-gnu --bundles ${{ matrix.format }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.format }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.rpm
          if-no-files-found: warn

  # Сборка под Windows
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64]
        format: [nsis, msi]
        include:
          - arch: i686
            format: nsis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
          override: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Install WiX Toolset
        if: matrix.format == 'msi'
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.UI.wixext WixToolset.Util.wixext

      - name: Build Tauri app
        run: |
          npm run tauri build -- --bundles ${{ matrix.format }} --target ${{ matrix.arch == 'x86_64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
        env:
          TAURI_SIGNING_COMMAND: ${{ secrets.WINDOWS_SIGNING_COMMAND }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.format }}
          path: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
          if-no-files-found: warn

  # Создание релиза
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.exe
            artifacts/**/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
